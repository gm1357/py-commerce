name: Set up toolchain
description: Node + the npm version pinned in package.json, npm ci, and optionally uv + uv sync.

inputs:
  python:
    description: Also install uv and sync the Python workspace.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # package.json pins an exact npm in devEngines and npm refuses to install with any other.
    - name: Install pinned npm
      shell: bash
      run: npm install -g "npm@$(node -p 'require("./package.json").devEngines.packageManager.version')"

    - name: Install JS dependencies
      shell: bash
      run: npm ci
      env:
        HUSKY: "0" # no git hooks in CI

    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - if: inputs.python == 'true'
      name: Install Python dependencies
      shell: bash
      run: uv sync --locked
