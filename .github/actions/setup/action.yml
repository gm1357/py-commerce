name: Set up toolchain
description: Node, npm ci, and optionally uv + uv sync.

inputs:
  python:
    description: Also install uv and sync the Python workspace.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # The npm bundled with Node 24 must satisfy devEngines.packageManager in package.json.
    - name: Install JS dependencies
      shell: bash
      run: npm ci
      env:
        HUSKY: "0" # no git hooks in CI

    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true

    - if: inputs.python == 'true'
      name: Install Python dependencies
      shell: bash
      run: uv sync --locked
