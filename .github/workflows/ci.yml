name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the history of the range it checks
      - uses: ./.github/actions/setup
        with:
          python: "false"

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A brand-new branch has no "before" commit; fall back to the last commit.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --verbose --last
          else
            npx commitlint --verbose --from "$BEFORE" --to "$GITHUB_SHA"
          fi

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx turbo run lint typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pycommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pycommerce"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pycommerce
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: npm run db:migrate -w api
      - run: npx turbo run test
