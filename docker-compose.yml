services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pycommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pycommerce"]
      interval: 2s
      timeout: 5s
      retries: 15

  pgweb:
    image: sosedoff/pgweb:0.17.0
    profiles: ["tools"]
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/pycommerce?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
